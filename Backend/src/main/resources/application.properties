spring.application.name=Logistics

# Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# AWS RDS Connection Settings
spring.datasource.url=jdbc:mysql://${DB_HOST}:${DB_PORT}/${DB_NAME}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Karachi
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# Actuator Endpoints Expose
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always